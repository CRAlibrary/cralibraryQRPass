<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Pass - CRA Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- 🟢 เปลี่ยนลิงก์ไอคอนเป็นเวอร์ชันล่าสุด 🟢 -->
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { 
        font-family: 'Sarabun', sans-serif; 
        background-color: #f0f4f8; 
        background-image: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(219, 234, 254) 90%);
        color: #1e293b; 
        overflow-x: hidden;
    }
    
    /* Background Decorative Blurs */
    .blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }

    /* Glass Card */
    .glass-card { 
        background: rgba(255, 255, 255, 0.95); 
        backdrop-filter: blur(20px);
        border-radius: 2rem; 
        box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.1); 
        border: 1px solid rgba(255,255,255,0.6);
    }

    /* Modern Inputs */
    .modern-input { 
        width: 100%; padding: 1.125rem 1.25rem; border-radius: 1rem; 
        background: #f8fafc; border: 2px solid transparent; 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        font-size: 1rem; font-weight: 500; color: #334155;
    }
    .modern-input:focus { 
        background: #ffffff; border-color: #3b82f6; 
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); outline: none; 
    }
    
    /* Modern Button */
    .btn-modern { 
        background: linear-gradient(135deg, #1e3a8a, #2563eb); 
        color: white; transition: all 0.3s ease; 
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn-modern:hover:not(:disabled) { 
        transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); 
    }
    .btn-modern:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Hide number arrows */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Fade Animation */
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center relative">

  <div class="absolute top-[5%] right-[10%] w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-50 blob"></div>
  <div class="absolute bottom-[10%] left-[10%] w-72 h-72 bg-emerald-200 rounded-full mix-blend-multiply filter blur-[80px] opacity-40 blob animation-delay-2000"></div>

  <div id="loginView" class="glass-card w-full max-w-sm p-6 md:p-8 text-center relative z-10 fade-in">
    <a href="?page=index" class="absolute top-6 left-6 w-10 h-10 bg-slate-100/80 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200 transition shrink-0"><i class="fi fi-sr-angle-left mt-1"></i></a>
    
    <div class="w-20 h-20 bg-blue-50 rounded-[1.5rem] flex items-center justify-center mx-auto mb-5 border border-blue-100 shadow-inner">
        <i class="fi fi-sr-qr-scan text-4xl text-blue-600 mt-2"></i>
    </div>
    <h2 class="text-2xl font-black text-slate-800 mb-1 tracking-tight">เข้าสู่ระบบ QR Pass</h2>
    <p class="text-sm text-slate-500 mb-8 font-medium">สำหรับสแกนเข้าใช้บริการห้องสมุด</p>

    <form id="emailForm" onsubmit="verifyUser(event, 'email')" class="space-y-5 fade-in">
        <div class="text-left">
            <label class="block text-sm font-bold mb-2 text-slate-700">อีเมลองค์กร (CRA Email)</label>
            <div class="flex relative group">
                <input type="text" id="loginEmail" class="modern-input rounded-r-none border-r-0 focus:z-10 font-sans" placeholder="example.name" required pattern="[a-zA-Z0-9._\-]+">
                <div class="bg-slate-100 border-2 border-transparent border-l-0 rounded-r-xl px-4 flex items-center text-slate-500 font-bold whitespace-nowrap transition-colors">
                    @cra.ac.th
                </div>
            </div>
        </div>
        <button type="submit" id="btnSubmitEmail" class="w-full btn-modern py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2">ดำเนินการต่อ <i class="fi fi-sr-arrow-right mt-1"></i></button>
        <button type="button" onclick="toggleForm()" class="text-sm text-blue-600 font-bold hover:text-blue-800 hover:underline mt-2 transition-colors">จำอีเมลไม่ได้? เข้าสู่ระบบด้วยเบอร์โทร</button>
    </form>

    <form id="phoneForm" onsubmit="verifyUser(event, 'phone')" class="space-y-5 hidden fade-in">
        <div class="text-left">
            <label class="block text-sm font-bold mb-2 text-slate-700">เบอร์โทรศัพท์มือถือ</label>
            <div class="relative">
                <i class="fi fi-sr-smartphone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="number" id="loginPhone" class="modern-input pl-12 font-sans" placeholder="08XXXXXXXX (10 หลัก)" required oninput="if(this.value.length > 10) this.value = this.value.slice(0,10);">
            </div>
        </div>
        <button type="submit" id="btnSubmitPhone" class="w-full btn-modern py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2">ดำเนินการต่อ <i class="fi fi-sr-arrow-right mt-1"></i></button>
        <button type="button" onclick="toggleForm()" class="text-sm text-slate-500 font-bold hover:text-slate-700 hover:underline mt-2 transition-colors">กลับไปใช้อีเมลองค์กร</button>
    </form>
  </div>

  <div id="qrView" class="glass-card w-full max-w-sm p-8 text-center hidden z-10 fade-in">
      <h2 class="text-2xl font-black text-slate-800 mb-1">บัตรสมาชิกห้องสมุด</h2>
      <p class="text-sm text-emerald-600 font-bold mb-6 flex items-center justify-center gap-1"><i class="fi fi-sr-shield-check mt-0.5"></i> ยืนยันตัวตนแล้ว</p>
      
      <div class="bg-slate-50/50 p-5 rounded-2xl border border-slate-200 mb-6 backdrop-blur-sm shadow-inner">
          <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 mx-auto object-cover rounded-xl border border-slate-100 bg-white p-2">
          <h3 id="resName" class="text-lg font-bold text-slate-800 mt-5 leading-tight"></h3>
          <p id="resId" class="text-blue-600 font-black tracking-wide break-words text-lg mt-1"></p>
      </div>

      <a href="?page=index" class="block w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition no-underline shadow-sm">
          ออกจากระบบ / กลับหน้าหลัก
      </a>
  </div>

  <script>
    // ⚠️ นำ URL ของ Web App มาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbyQII84bz9ZD8t1sLVKw_DPBgOb-5N9yEP6MwCWlcPBWmyytR5FZUYrKLY_IA4ZYgRz/exec"; 

    function toggleForm() {
        const emailF = document.getElementById('emailForm');
        const phoneF = document.getElementById('phoneForm');
        
        if(emailF.classList.contains('hidden')) {
            emailF.classList.remove('hidden');
            phoneF.classList.add('hidden');
        } else {
            emailF.classList.add('hidden');
            phoneF.classList.remove('hidden');
        }
    }

    async function verifyUser(e, type) {
        e.preventDefault();
        
        let searchValue = "";
        let btn;

        if (type === 'email') {
            searchValue = document.getElementById('loginEmail').value.trim() + "@cra.ac.th";
            btn = document.getElementById('btnSubmitEmail');
        } else {
            searchValue = document.getElementById('loginPhone').value.trim();
            if(searchValue.length !== 10) return Swal.fire({icon:'warning', title:'เตือน', text:'เบอร์โทรศัพท์ต้องมี 10 หลัก'});
            btn = document.getElementById('btnSubmitPhone');
        }

        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fi fi-sr-spinner animate-spin text-xl"></i> ค้นหาข้อมูล...';

        try {
            // Step 1: Find name for confirmation
            const res1 = await fetch(API_URL || window.location.href, {
                method: 'POST',
                body: JSON.stringify({ action: 'loginStep1', searchType: type, searchValue: searchValue })
            }).then(r => r.json());

            btn.disabled = false;
            btn.innerHTML = originalText;

            if (res1.status === 'error') {
                return Swal.fire({icon:'error', title:'ไม่พบข้อมูล', text: res1.message, confirmButtonColor: '#2563eb', customClass: { popup: 'rounded-3xl font-sans' }});
            }

            // Ask for confirmation
            Swal.fire({
                title: 'ใช่คุณหรือไม่?',
                html: `<div class="text-xl font-bold text-blue-800 p-4 bg-blue-50 rounded-xl mt-2 border border-blue-100">${res1.name}</div>`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ใช่, เข้าสู่ระบบ',
                cancelButtonText: 'ไม่ใช่, พิมพ์ใหม่',
                customClass: { popup: 'rounded-3xl font-sans' }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    
                    Swal.fire({
                        title: 'กำลังดึงข้อมูลบัตร...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading() },
                        customClass: { popup: 'rounded-3xl font-sans' }
                    });

                    // Step 2: Update login time and fetch QR
                    const res2 = await fetch(API_URL || window.location.href, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'loginStep2', rowIndex: res1.rowIndex })
                    }).then(r => r.json());

                    Swal.close();

                    if (res2.status === 'success') {
                        document.getElementById('loginView').classList.add('hidden');
                        document.getElementById('qrView').classList.remove('hidden');
                        document.getElementById('qrImage').src = res2.qr;
                        document.getElementById('resName').innerText = res2.name;
                        document.getElementById('resId').innerText = "ID: " + res2.id;
                    } else {
                        Swal.fire({icon:'error', title:'เกิดข้อผิดพลาด', text: res2.message, customClass: { popup: 'rounded-3xl' }});
                    }
                }
            });

        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = originalText;
            Swal.fire({icon:'error', title:'การเชื่อมต่อขัดข้อง', text:'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', customClass: { popup: 'rounded-3xl' }});
        }
    }
  </script>
</body>
</html>
