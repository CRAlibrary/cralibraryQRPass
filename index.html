<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRA Library ID Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- 🟢 เปลี่ยนลิงก์ไอคอนเป็นเวอร์ชันล่าสุด 🟢 -->
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
  
  <style>
    body { 
        font-family: 'Sarabun', sans-serif; 
        background-color: #f0f4f8; 
        background-image: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(219, 234, 254) 90%);
        color: #1e293b; 
        overflow-x: hidden;
    }
    
    /* Animated Background Blobs */
    .blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }

    /* Glassmorphism Card */
    .glass-card { 
        background: rgba(255, 255, 255, 0.7); 
        backdrop-filter: blur(20px);
        border-radius: 2rem; 
        box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.1); 
        border: 1px solid rgba(255,255,255,0.8);
        transition: all 0.3s ease;
    }
    .glass-card:hover {
        background: rgba(255, 255, 255, 0.85); 
        transform: translateY(-5px);
        box-shadow: 0 25px 50px -12px rgba(30, 58, 138, 0.15); 
    }

    /* Modern Buttons */
    .btn-modern { 
        background: linear-gradient(135deg, #1e3a8a, #2563eb); 
        color: white; transition: all 0.3s ease; 
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn-modern:hover { 
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); 
    }

    .icon-box {
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        border: 1px solid white;
    }

    .floating-btn { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative px-4 pb-12 pt-6">

  <div class="absolute top-[10%] left-[10%] w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-50 blob"></div>
  <div class="absolute bottom-[20%] right-[10%] w-72 h-72 bg-amber-200 rounded-full mix-blend-multiply filter blur-[80px] opacity-50 blob animation-delay-2000"></div>

  <div class="text-center mb-10 z-10 w-full max-w-md relative">
    <div class="w-24 h-24 bg-white rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-900/10 border border-blue-50 relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-50 to-transparent opacity-50"></div>
        <i class="fi fi-sr-books text-5xl text-blue-600 mt-2 relative z-10"></i>
    </div>
    <h1 class="text-4xl md:text-5xl font-black mb-2 tracking-tight text-slate-800">CRA Library</h1>
    <p class="text-lg text-slate-500 font-medium tracking-wide">Digital ID Card System</p>
  </div>

  <div class="w-full max-w-sm flex flex-col gap-4 z-10">
      
      <!-- Login Button -->
      <!-- ⚠️ เปลี่ยนลิงก์ YOUR_SCRIPT_URL_HERE เป็น URL ของเว็บแอปคุณ -->
      <a href="login.html" class="glass-card w-full p-5 flex items-center gap-5 text-left no-underline group cursor-pointer">
          <div class="w-14 h-14 icon-box rounded-2xl flex items-center justify-center shrink-0 shadow-inner group-hover:scale-110 transition-transform duration-300">
              <i class="fi fi-sr-qr-scan text-2xl text-blue-600"></i>
          </div>
          <div>
              <h2 class="text-xl font-black text-slate-800 mb-0.5 group-hover:text-blue-600 transition-colors">เข้าใช้งาน QR Pass</h2>
              <p class="text-slate-500 text-sm font-medium">สำหรับผู้ที่มีรหัสในระบบแล้ว</p>
          </div>
          <i class="fi fi-sr-angle-right ml-auto text-slate-300 text-xl group-hover:text-blue-500 transition-colors"></i>
      </a>

      <!-- Register Button -->
      <a href="reg.html" class="glass-card w-full p-5 flex items-center gap-5 text-left no-underline group cursor-pointer">
          <div class="w-14 h-14 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-center shrink-0 shadow-inner group-hover:scale-110 transition-transform duration-300">
              <i class="fi fi-sr-user-add text-2xl text-slate-400 group-hover:text-amber-500 transition-colors"></i>
          </div>
          <div>
              <h2 class="text-xl font-black text-slate-800 mb-0.5">ลงทะเบียนผู้ใช้ใหม่</h2>
              <p class="text-slate-500 text-sm font-medium">สร้างบัตรห้องสมุดดิจิทัล</p>
          </div>
          <i class="fi fi-sr-angle-right ml-auto text-slate-300 text-xl group-hover:text-amber-500 transition-colors"></i>
      </a>
  </div>

  <p class="absolute bottom-6 text-sm text-slate-400 font-medium">Chulabhorn Royal Academy Library</p>

  <button onclick="reportIssue()" class="floating-btn fixed bottom-8 right-6 md:right-10 w-14 h-14 bg-white border border-slate-200 text-rose-500 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.1)] flex items-center justify-center transition-all hover:scale-110 z-50 group">
      <i class="fi fi-sr-headset text-2xl mt-1"></i>
      <span class="absolute right-16 bg-slate-800 text-white text-xs px-3 py-2 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none font-medium shadow-lg">แจ้งปัญหาการใช้งาน</span>
  </button>

  <script>
    function reportIssue() {
        const email = "library@cra.ac.th";
        const subject = encodeURIComponent("แจ้งปัญหาการใช้งาน CRA Library ID Card");
        const body = encodeURIComponent(`เรียน ทีมงานห้องสมุด,

ข้าพเจ้า นาย/นาง/นางสาว ........................................
รหัสประจำตัว: ........................

ต้องการแจ้งปัญหาดังนี้:
(โปรดระบุปัญหา เช่น เปลี่ยนเบอร์โทรศัพท์, กรอกอีเมลผิด เป็นต้น)

......................................................................................

ขอแสดงความนับถือ`);
        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
